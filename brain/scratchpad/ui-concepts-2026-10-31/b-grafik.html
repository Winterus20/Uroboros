<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept B — Graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505; --s1: #0c0c0c; --s2: #131313;
  --line: #222; --line2: #333;
  --tx: #f2f2ee; --dim: #9a9a92; --faint: #5c5c57;
  --ac: #98e500; --ac-ink: #0a1200;
  --ui: 'Space Grotesk', system-ui, sans-serif; --mono: 'Space Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--tx); font-family: var(--ui); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: 48px 1fr 34px; height: 100vh; }

/* Üst bar: numaralı sekmeler — yeni katman = sıradaki numara */
.top { display: flex; align-items: stretch; border-bottom: 2px solid var(--ac); }
.logo { display: flex; align-items: center; padding: 0 18px; background: var(--ac); color: var(--ac-ink); font-weight: 500; font-size: 15px; letter-spacing: .04em; }
.tabs { display: flex; }
.tab { display: flex; align-items: center; gap: 8px; padding: 0 20px; font: 12px var(--mono); letter-spacing: .06em; color: var(--dim); border-right: 1px solid var(--line); cursor: pointer; position: relative; }
.tab b { font-weight: 400; color: var(--faint); }
.tab:hover { color: var(--tx); }
.tab.on { color: var(--ac-ink); background: var(--tx); }
.tab.on b { color: var(--ac-ink); }
.tab.locked { color: #3a3a3a; cursor: default; }
.tab .n { font-size: 10px; padding: 1px 5px; border: 1px solid currentColor; }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 14px; padding: 0 18px; font: 11px var(--mono); color: var(--dim); }
.seg-bar { display: flex; gap: 2px; }
.seg-bar i { width: 5px; height: 14px; background: #1c1c1c; }
.seg-bar i.on { background: var(--ac); }
.gear { width: 30px; height: 30px; border: 1px solid var(--line2); background: transparent; color: var(--dim); cursor: pointer; display: grid; place-items: center; }
.gear:hover { color: var(--tx); border-color: var(--tx); }

.main { overflow-y: auto; padding: 34px 48px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line2); position: relative; }
.label { font: 11px var(--mono); letter-spacing: .08em; color: var(--ac); }
.label span { color: var(--dim); }
.num { margin-top: 8px; font-weight: 300; font-size: 132px; line-height: .9; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.num small { font-size: 46px; letter-spacing: -.02em; color: var(--ac); margin-left: 6px; }
.meta { margin-top: 14px; display: flex; gap: 22px; font: 12px var(--mono); color: var(--dim); }
.meta b { font-weight: 400; color: var(--tx); }
.meta .acc { color: var(--ac); }
.tapbox { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; position: relative; }
.tap { height: 38px; padding: 0 18px; border: 1px solid var(--tx); background: transparent; font: 14px var(--mono); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background .08s, color .08s; }
.tap span { font-size: 10px; color: var(--faint); }
.tap:hover { background: var(--tx); color: var(--bg); }
.tap:hover span { color: #555; }
.tap:active { transform: translate(1px, 1px); }
.tapbox small { font: 10px var(--mono); color: var(--faint); letter-spacing: .06em; }
.float { position: absolute; top: -4px; right: 30px; font: 14px var(--mono); color: var(--ac); pointer-events: none; animation: up .6s ease-out forwards; }
@keyframes up { to { opacity: 0; transform: translateY(-32px); } }
@keyframes pop { 40% { transform: scale(1.02); } }
.pop { animation: pop .15s ease-out; transform-origin: left bottom; }
.corner { position: absolute; width: 10px; height: 10px; border-color: var(--faint); border-style: solid; }

/* Bölüm başlığı */
.head { display: flex; align-items: flex-end; justify-content: space-between; margin: 30px 0 14px; }
.head h2 { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -.01em; line-height: 1; }
.head h2 b { font: 12px var(--mono); color: var(--ac); vertical-align: top; margin-right: 10px; font-weight: 400; }
.head p { margin: 8px 0 0; font: 11px var(--mono); color: var(--dim); }
.ctrl { display: flex; gap: 0; }
.ctrl button { height: 32px; padding: 0 14px; border: 1px solid var(--line2); margin-left: -1px; background: transparent; font: 11px var(--mono); color: var(--dim); cursor: pointer; }
.ctrl button.on { background: var(--tx); color: var(--bg); border-color: var(--tx); position: relative; }
.ctrl button:hover:not(.on) { color: var(--tx); }
.ctrl .all { margin-left: 10px; border-color: var(--ac); color: var(--ac); }
.ctrl .all:hover { background: var(--ac); color: var(--ac-ink) !important; }

/* Kart ızgarası */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line2); background: var(--s1); padding: 14px 14px 0; display: flex; flex-direction: column; min-height: 196px; }
.card.ok { border-color: var(--ac); }
.card .id { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--faint); letter-spacing: .08em; }
.card.ok .id span:first-child { color: var(--ac); }
.card h3 { margin: 6px 0 0; font-size: 20px; font-weight: 500; letter-spacing: .01em; text-transform: uppercase; }
.stats { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font: 11px var(--mono); }
.stats dt { color: var(--faint); font-size: 9px; letter-spacing: .1em; }
.stats dd { margin: 0; color: var(--tx); }
.blk { margin-top: auto; padding: 12px 0 10px; display: flex; gap: 2px; }
.blk i { flex: 1; height: 6px; background: #1d1d1d; }
.blk i.on { background: var(--ac); }
.buy { margin: 0 -14px; height: 38px; border: 0; border-top: 1px solid var(--line2); background: var(--s2); font: 12px var(--mono); color: var(--faint); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; position: relative; overflow: hidden; cursor: default; }
.buy .fill { position: absolute; inset: 0; background: rgba(152, 229, 0, .08); transform-origin: left; }
.buy span { position: relative; }
.card.ok .buy { background: var(--ac); color: var(--ac-ink); border-top-color: var(--ac); cursor: pointer; }
.card.ok .buy .fill { display: none; }
.card.ok .buy:hover { background: #aef51a; }
.card.ok .buy:active span { transform: translateY(1px); }
.card.locked { border-style: dashed; border-color: #2a2a2a; background: repeating-linear-gradient(-45deg, transparent 0 8px, #0d0d0d 8px 9px); }
.card.locked h3 { color: #4a4a4a; }
.card.locked .why { margin-top: auto; padding-bottom: 14px; font: 11px var(--mono); color: var(--dim); }

/* Ticker */
.status { display: flex; align-items: center; gap: 12px; padding: 0 20px; border-top: 1px solid var(--line2); font: 12px var(--mono); color: var(--dim); }
.status .tag { background: var(--tx); color: var(--bg); padding: 2px 6px; font-size: 10px; letter-spacing: .08em; }
.status .cur { display: inline-block; width: 7px; height: 13px; background: var(--ac); vertical-align: -2px; margin-left: 3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.status .r { margin-left: auto; color: var(--faint); font-size: 11px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">HTN_</div>
    <nav class="tabs">
      <div class="tab on"><b>01</b>CHAIN</div>
      <div class="tab"><b>02</b>CHALLENGES <span class="n">3/8</span></div>
      <div class="tab locked"><b>03</b>████████</div>
      <div class="tab locked"><b>04</b>██████</div>
      <div class="tab"><b>+</b>STATS</div>
    </nav>
    <div class="right">
      <span>GOAL</span><div class="seg-bar" id="goalSeg"></div><span id="goalPct" style="color:var(--tx)"></span>
      <button class="gear" aria-label="Settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main class="main"><div class="wrap">
    <section class="hero">
      <div>
        <div class="label">// RUNG 01 <span>— I THOUGHT IT WAS A WALL</span></div>
        <div class="num" id="num"></div>
        <div class="meta"><span class="acc" id="rate"></span><span>NEXT <b>C4 · PENCIL</b> @ 1E40</span></div>
      </div>
      <div class="tapbox" id="tapBox">
        <button class="tap" id="tap">+1 <span>[SPACE]</span></button>
        <small id="taps"></small>
      </div>
    </section>

    <div class="head">
      <div><h2><b>01</b>CHAIN</h2><p>EACH RING FEEDS THE ONE ABOVE IT · 10 OPENS THE NEXT</p></div>
      <div class="ctrl" id="modes"><button data-m="1" class="on">×1</button><button data-m="10">×10</button><button data-m="max">MAX</button><button class="all" id="maxAll">MAX ALL</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </div></main>

  <footer class="status"><span class="tag">TX</span><span><span id="ticker"></span><span class="cur"></span></span><span class="r">20 TPS · SAVED 4S AGO</span></footer>
</div>

<script type="module">
import { createSim, tick, buy, cost, block, unlocked, produces, perSecond, goalPct, fmt, heroParts, TICKER } from './sim.js'
const s = createSim()
const $ = (id) => document.getElementById(id)
const up = (t) => t.toUpperCase()

function render() {
  const h = heroParts(s.number)
  $('num').innerHTML = h.base + (h.tail ? '<small>' + h.tail + '</small>' : '')
  $('rate').textContent = '+' + up(fmt(perSecond(s))) + '/S'
  const g = goalPct(s)
  $('goalPct').textContent = g.toFixed(1) + '%'
  $('goalSeg').innerHTML = Array.from({ length: 40 }, (_, k) => `<i class="${k < Math.max(1, Math.round(g / 2.5)) ? 'on' : ''}"></i>`).join('')
  $('taps').textContent = s.taps + ' PRESSES'
  $('grid').innerHTML = s.rings.filter((r) => r.i <= 4).map((r) => {
    const id = 'R' + String(r.i + 1).padStart(2, '0')
    if (!unlocked(s, r)) {
      const prev = s.rings[r.i - 1]
      return `<div class="card locked"><div class="id"><span>${id}</span><span>LOCKED</span></div><h3>${r.name}</h3><div class="why">${10 - prev.bought} MORE ${up(prev.name)}</div></div>`
    }
    const c = cost(r), ok = s.number >= c
    const pips = Array.from({ length: 10 }, (_, k) => `<i class="${k < r.bought % 10 ? 'on' : ''}"></i>`).join('')
    return `<div class="card ${ok ? 'ok' : ''}"><div class="id"><span>${id}</span><span>×${block(r).toFixed(2)}</span></div>
      <h3>${r.name}</h3>
      <dl class="stats"><div><dt>OWNED</dt><dd>${fmt(r.amount, 0)}</dd></div><div><dt>PRODUCES</dt><dd>${up(fmt(produces(r)))}/S</dd></div></dl>
      <div class="blk">${pips}</div>
      <button class="buy" data-i="${r.i}"><i class="fill" style="transform:scaleX(${Math.min(1, s.number / c)})"></i><span>BUY</span><span>${up(fmt(c))}</span></button></div>`
  }).join('')
}

$('grid').addEventListener('click', (e) => { const b = e.target.closest('.buy'); if (b && buy(s, +b.dataset.i)) { pop(); render() } })
$('modes').addEventListener('click', (e) => { const b = e.target.closest('button[data-m]'); if (!b) return; s.buyMode = b.dataset.m === 'max' ? 'max' : +b.dataset.m; $('modes').querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)) })
$('maxAll').onclick = () => { const m = s.buyMode; s.buyMode = 'max'; s.rings.forEach((r) => buy(s, r.i)); s.buyMode = m; pop(); render() }
function pop() { const n = $('num'); n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop') }
function press() {
  s.number += 1; s.taps++
  const f = document.createElement('span'); f.className = 'float'; f.textContent = '+1'; $('tapBox').appendChild(f); setTimeout(() => f.remove(), 600)
  render()
}
$('tap').onclick = press
addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); press() } })

let t = 0; $('ticker').textContent = up(TICKER[0])
setInterval(() => { $('ticker').textContent = up(TICKER[++t % TICKER.length]) }, 7000)
let last = performance.now()
setInterval(() => { const now = performance.now(); tick(s, (now - last) / 1000); last = now; render() }, 100)
render()
</script>
</body>
</html>
