<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept C — Layer tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a0f; --s1: #0f1117; --s2: #151821; --s3: #1c202b;
  --line: #1e2230; --line2: #2b3040;
  --tx: #ebeae6; --dim: #8f8e8a; --faint: #575a66;
  --ac: #98e500; --ac-soft: rgba(152,229,0,.10); --ac-line: rgba(152,229,0,.5);
  --amber: #f59e0b; --amber-soft: rgba(245,158,11,.10);
  --ui: 'Space Grotesk', system-ui, sans-serif; --mono: 'Space Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--tx); font-family: var(--ui); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

/* Sol: katman haritası */
.map { position: relative; border-right: 1px solid var(--line); background: radial-gradient(120% 60% at 50% 100%, rgba(152,229,0,.05), transparent 60%), var(--s1); display: flex; flex-direction: column; }
.map-head { padding: 20px 22px 0; display: flex; align-items: center; gap: 10px; }
.mark { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ac); display: grid; place-items: center; font: 11px var(--mono); color: var(--ac); }
.map-head span { font-size: 12px; letter-spacing: .16em; color: var(--dim); }
.map svg { flex: 1; width: 100%; }
.node { cursor: pointer; }
.node circle.ring { fill: var(--s2); stroke: var(--line2); stroke-width: 1.5; transition: stroke .2s; }
.node:hover circle.ring { stroke: var(--dim); }
.node.on circle.ring { stroke: var(--ac); stroke-width: 2; fill: #141a0d; }
.node.can circle.halo { stroke: var(--ac-line); }
.node circle.halo { fill: none; stroke: transparent; stroke-width: 1; stroke-dasharray: 3 4; animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.node text.l { font: 12px var(--mono); fill: var(--tx); text-anchor: middle; dominant-baseline: central; }
.node.on text.l { fill: var(--ac); }
.node text.cap { font: 10px var(--mono); fill: var(--dim); text-anchor: middle; letter-spacing: .06em; }
.node.amber circle.ring { stroke: rgba(245,158,11,.55); fill: #18140b; }
.node.amber text.l { fill: var(--amber); }
.node.locked { cursor: default; }
.node.locked circle.ring { fill: #0c0d12; stroke: #22252f; stroke-dasharray: 2 3; }
.node.locked text.l { fill: #3d404b; }
.edge { stroke: var(--line2); stroke-width: 1.5; fill: none; }
.edge.dash { stroke: #22252f; stroke-dasharray: 3 4; }
.map-foot { padding: 0 22px 18px; display: flex; gap: 8px; }
.mini { flex: 1; height: 34px; border-radius: 10px; border: 1px solid var(--line2); background: var(--s2); color: var(--dim); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.mini:hover { color: var(--tx); }

/* Sağ: seçili katman */
.main { display: grid; grid-template-rows: 56px 1fr 40px; min-width: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 0 36px; border-bottom: 1px solid var(--line); }
.crumb { font-size: 13px; color: var(--dim); }
.crumb b { color: var(--tx); font-weight: 500; }
.res { margin-left: auto; display: flex; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s1); font-size: 12px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); }
.chip.amber i { background: var(--amber); }
.chip .sub { color: var(--dim); font-size: 11px; }

.body { overflow-y: auto; padding: 30px 36px 30px; }
.wrap { max-width: 1000px; margin: 0 auto; }
.hero { border-radius: 20px; border: 1px solid var(--line); background: radial-gradient(70% 90% at 20% 0%, rgba(152,229,0,.08), transparent 70%), var(--s1); padding: 26px 30px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
.kick { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
.kick .pill { padding: 3px 10px; border-radius: 999px; background: var(--ac-soft); color: var(--ac); font: 10px var(--mono); letter-spacing: .08em; }
.num { margin-top: 8px; font-weight: 300; font-size: 96px; line-height: 1; letter-spacing: -.035em; color: var(--ac); font-variant-numeric: tabular-nums; }
.num small { font-size: 36px; opacity: .9; margin-left: 4px; }
.goal { margin-top: 14px; display: flex; align-items: center; gap: 12px; font: 11px var(--mono); color: var(--dim); }
.track { flex: 1; max-width: 420px; height: 8px; border-radius: 999px; background: var(--s3); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6aa300, var(--ac)); }
.tapc { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; position: relative; }
.rate { font: 13px var(--mono); color: var(--tx); }
.rate span { color: var(--dim); }
.tap { height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s2); font: 13px var(--mono); cursor: pointer; display: flex; gap: 10px; align-items: center; transition: border-color .1s, background .1s, transform .06s; }
.tap:hover { border-color: var(--ac-line); }
.tap:active { transform: scale(.97); background: var(--s3); }
.tap kbd { font: 10px var(--mono); color: var(--faint); }
.tapc small { font: 10px var(--mono); color: var(--faint); }
.float { position: absolute; bottom: 44px; right: 26px; font: 13px var(--mono); color: var(--ac); pointer-events: none; animation: up .6s ease-out forwards; }
@keyframes up { to { opacity: 0; transform: translateY(-30px); } }
@keyframes pop { 40% { transform: scale(1.025); } }
.pop { animation: pop .16s ease-out; transform-origin: left bottom; }

.head { display: flex; align-items: center; justify-content: space-between; margin: 28px 4px 14px; }
.head h2 { margin: 0; font-size: 16px; font-weight: 500; }
.head p { margin: 3px 0 0; font-size: 12px; color: var(--dim); }
.seg { display: flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s1); }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 14px; border-radius: 999px; font: 11px var(--mono); color: var(--dim); cursor: pointer; }
.seg button.on { background: var(--s3); color: var(--tx); }
.allb { margin-left: 8px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--ac-line); background: transparent; color: var(--ac); font-size: 12px; cursor: pointer; }
.allb:hover { background: var(--ac-soft); }

.list { display: flex; flex-direction: column; gap: 8px; }
.ring { display: grid; grid-template-columns: 44px minmax(0, 1.2fr) minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 10px 10px 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--s1); transition: border-color .15s; }
.ring.ok { border-color: rgba(152,229,0,.28); }
.badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; position: relative; font: 12px var(--mono); color: var(--dim); }
.badge svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring.ok .badge { color: var(--ac); }
.nm { font-size: 15px; }
.nm small { display: block; margin-top: 3px; font: 11px var(--mono); color: var(--dim); }
.mul { font: 12px var(--mono); color: var(--dim); }
.mul b { color: var(--tx); font-weight: 400; }
.buy { position: relative; overflow: hidden; height: 40px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s2); font: 12px var(--mono); color: var(--faint); cursor: default; }
.buy .fill { position: absolute; inset: 0; background: var(--ac-soft); transform-origin: left; }
.buy span { position: relative; }
.ring.ok .buy { border-color: var(--ac-line); color: var(--tx); cursor: pointer; }
.ring.ok .buy:hover { background: #18200f; }
.ring.ok .buy:active { transform: scale(.98); }
.ring.lock { background: transparent; border-style: dashed; }
.ring.lock .nm { color: var(--faint); }
.ring.lock .badge { color: #3d404b; }

.tick { display: flex; align-items: center; gap: 10px; padding: 0 36px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.tick i { width: 6px; height: 6px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
</style>
</head>
<body>
<div class="app">
  <aside class="map">
    <div class="map-head"><div class="mark">#</div><span>HOLD THAT NUMBER</span></div>
    <svg viewBox="0 0 300 560" preserveAspectRatio="xMidYMid meet" id="tree">
      <path class="edge" d="M150 470 C150 420 80 420 80 360"/>
      <path class="edge" d="M150 470 C150 420 220 420 220 360"/>
      <path class="edge dash" d="M80 360 C80 300 150 300 150 240"/>
      <path class="edge dash" d="M220 360 C220 300 150 300 150 240"/>
      <path class="edge dash" d="M150 240 C150 190 80 190 80 130"/>
      <path class="edge dash" d="M150 240 C150 190 220 190 220 130"/>

      <g class="node on can" data-n="number" transform="translate(150 470)"><circle class="halo" r="40"/><circle class="ring" r="32"/><text class="l">N</text><text class="cap" y="56">NUMBER</text></g>
      <g class="node can" data-n="challenges" transform="translate(80 360)"><circle class="halo" r="33"/><circle class="ring" r="26"/><text class="l">C</text><text class="cap" y="48">CHALLENGES 3/8</text></g>
      <g class="node amber" data-n="definitions" transform="translate(220 360)"><circle class="halo" r="33"/><circle class="ring" r="26"/><text class="l">D</text><text class="cap" y="48">DEFINITIONS</text></g>
      <g class="node locked" transform="translate(150 240)"><circle class="ring" r="24"/><text class="l">?</text></g>
      <g class="node locked" transform="translate(80 130)"><circle class="ring" r="22"/><text class="l">?</text></g>
      <g class="node locked" transform="translate(220 130)"><circle class="ring" r="22"/><text class="l">?</text></g>
    </svg>
    <div class="map-foot">
      <button class="mini"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7"/></svg>Stats</button>
      <button class="mini"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <div class="crumb">Rung 1 / <b id="crumb">Number</b></div>
      <div class="res">
        <div class="chip"><i></i><span class="mono" id="chipNum"></span><span class="sub mono" id="chipRate"></span></div>
        <div class="chip amber"><i></i><span class="mono">0</span><span class="sub">Definitions</span></div>
      </div>
    </header>
    <div class="body"><div class="wrap">
      <div class="hero">
        <div>
          <div class="kick"><span class="pill">RUNG 1 / 11</span>I thought it was a wall</div>
          <div class="num" id="num"></div>
          <div class="goal"><div class="track"><i id="goalBar"></i></div><span id="goalPct"></span><span style="color:var(--faint)">to 1.79e308</span></div>
        </div>
        <div class="tapc" id="tapC">
          <div class="rate" id="rate"></div>
          <button class="tap" id="tap">+1 <kbd>space</kbd></button>
          <small id="taps"></small>
        </div>
      </div>

      <div class="head">
        <div><h2>Chain</h2><p>Next: C4 · Pencil opens at 1e40</p></div>
        <div style="display:flex;align-items:center"><div class="seg" id="modes"><button data-m="1" class="on">×1</button><button data-m="10">×10</button><button data-m="max">Max</button></div><button class="allb" id="maxAll">Max all</button></div>
      </div>
      <div class="list" id="list"></div>
    </div></div>
    <footer class="tick"><i></i><span id="ticker"></span></footer>
  </section>
</div>

<script type="module">
import { createSim, tick, buy, cost, block, unlocked, produces, perSecond, goalPct, fmt, heroParts, TICKER } from './sim.js'
const s = createSim()
const $ = (id) => document.getElementById(id)
const C = 2 * Math.PI * 19

function ringBadge(r, on) {
  const p = (r.bought % 10) / 10
  return `<div class="badge"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#1e2230" stroke-width="3"/>${on ? `<circle cx="22" cy="22" r="19" fill="none" stroke="#98e500" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C * p} ${C}"/>` : ''}</svg>${String(r.i + 1).padStart(2, '0')}</div>`
}

function render() {
  const h = heroParts(s.number)
  $('num').innerHTML = h.base + (h.tail ? '<small>' + h.tail + '</small>' : '')
  $('rate').innerHTML = '+' + fmt(perSecond(s)) + ' <span>/s</span>'
  $('chipNum').textContent = fmt(s.number)
  $('chipRate').textContent = '+' + fmt(perSecond(s)) + '/s'
  $('goalPct').textContent = goalPct(s).toFixed(1) + '%'
  $('goalBar').style.width = Math.max(1.5, goalPct(s)) + '%'
  $('taps').textContent = s.taps + ' presses'
  $('list').innerHTML = s.rings.filter((r) => r.i <= 4).map((r) => {
    if (!unlocked(s, r)) {
      const prev = s.rings[r.i - 1]
      return `<div class="ring lock">${ringBadge(r, false)}<div class="nm">${r.name}<small>${10 - prev.bought} more ${prev.name}</small></div><div></div><div></div></div>`
    }
    const c = cost(r), ok = s.number >= c
    return `<div class="ring ${ok ? 'ok' : ''}">${ringBadge(r, true)}
      <div class="nm">${r.name}<small>${fmt(r.amount, 0)} owned · ${fmt(produces(r))}/s</small></div>
      <div class="mul">block ${r.bought % 10}/10 · <b>×${block(r).toFixed(2)}</b></div>
      <button class="buy" data-i="${r.i}"><i class="fill" style="transform:scaleX(${Math.min(1, s.number / c)})"></i><span>${fmt(c)}</span></button></div>`
  }).join('')
}

$('list').addEventListener('click', (e) => { const b = e.target.closest('.buy'); if (b && buy(s, +b.dataset.i)) { pop(); render() } })
$('modes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; s.buyMode = b.dataset.m === 'max' ? 'max' : +b.dataset.m; [...$('modes').children].forEach((x) => x.classList.toggle('on', x === b)) })
$('maxAll').onclick = () => { const m = s.buyMode; s.buyMode = 'max'; s.rings.forEach((r) => buy(s, r.i)); s.buyMode = m; pop(); render() }
$('tree').addEventListener('click', (e) => {
  const n = e.target.closest('.node'); if (!n || n.classList.contains('locked')) return
  document.querySelectorAll('.node').forEach((x) => x.classList.toggle('on', x === n))
  $('crumb').textContent = n.dataset.n[0].toUpperCase() + n.dataset.n.slice(1)
})
function pop() { const n = $('num'); n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop') }
function press() {
  s.number += 1; s.taps++
  const f = document.createElement('span'); f.className = 'float'; f.textContent = '+1'; $('tapC').appendChild(f); setTimeout(() => f.remove(), 600)
  render()
}
$('tap').onclick = press
addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); press() } })

let t = 0; $('ticker').textContent = TICKER[0]
setInterval(() => { $('ticker').textContent = TICKER[++t % TICKER.length] }, 7000)
let last = performance.now()
setInterval(() => { const now = performance.now(); tick(s, (now - last) / 1000); last = now; render() }, 100)
render()
</script>
</body>
</html>
